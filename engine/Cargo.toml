[workspace]
resolver = "2"
members = [
    "crates/ra2fmt",
    "crates/ra2-cli",
    "crates/ra2-render",
    "crates/ra2-shell",
    "crates/ra2sim",
    "crates/ra2script",
    "crates/ra2ui",
    "crates/ra2-app",
    "crates/ra2-audio",
    "crates/ra2net",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
